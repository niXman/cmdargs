name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  ubuntu-gcc:
    name: ubuntu-gcc
    runs-on: ubuntu-latest
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S test -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  ubuntu-clang:
    name: ubuntu-clang
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S test -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

windows-msvc-cl:
  name: windows-msvc-cl
  runs-on: windows-latest
  steps:
    - uses: actions/checkout@v4
    - name: Configure
      run: cmake -S test -B build -A x64

windows-msvc-clang:
  name: windows-msvc-clang
  runs-on: windows-latest
  steps:
    - uses: actions/checkout@v4
    - name: Configure
      run: cmake -S test -B build -T ClangCL -A x64
